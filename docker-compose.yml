
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: joblens-db
    environment:
      POSTGRES_DB: joblens
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joblens_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
