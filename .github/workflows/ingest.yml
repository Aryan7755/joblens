name: Ingest jobs

on:
  workflow_dispatch:
  # Uncomment after adding the DATABASE_URL secret in Phase 7.
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ingest.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
